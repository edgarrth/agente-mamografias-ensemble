split:
  configuration_ratio: 0.30
  final_test_ratio: 0.70
  by_patient: true
  stratified: true
  seed: 42

weights:
  W01: [0.333333, 0.333333, 0.333334]
  W02: [0.40, 0.30, 0.30]
  W03: [0.30, 0.40, 0.30]
  W04: [0.30, 0.30, 0.40]
  W05: [0.50, 0.25, 0.25]
  W06: [0.25, 0.50, 0.25]
  W07: [0.25, 0.25, 0.50]
  W08: [0.50, 0.30, 0.20]
  W09: [0.50, 0.20, 0.30]
  W10: [0.30, 0.50, 0.20]
  W11: [0.20, 0.50, 0.30]
  W12: [0.30, 0.20, 0.50]
  W13: [0.20, 0.30, 0.50]
  W14: [0.60, 0.20, 0.20]
  W15: [0.20, 0.60, 0.20]
  W16: [0.20, 0.20, 0.60]

# v0.22+ replaces the obsolete fixed 0.40-0.60 threshold grid. Five candidates
# are derived separately for each weight combination from score quantiles in the
# Configuration Set. Ground-truth labels are NOT used to construct candidate
# thresholds; labels are used only afterwards to evaluate each candidate.
threshold_strategy:
  mode: score_quantiles
  derive_per_weight: true
  ground_truth_used_for_derivation: false
  quantiles:
    T01: 0.10
    T02: 0.30
    T03: 0.50
    T04: 0.70
    T05: 0.90

legacy_thresholds_v021_not_used:
  T01: 0.40
  T02: 0.45
  T03: 0.50
  T04: 0.55
  T05: 0.60

# v0.23 selection avoids the previous "minimum FN first" policy, which can
# reward an almost-all-positive classifier. ROC-AUC selects the weighting;
# Balanced Accuracy selects the operating point; Sensitivity/Specificity break ties.
selection:
  balanced_accuracy_tolerance: 0.00
  order:
    - highest_roc_auc_by_weights
    - highest_balanced_accuracy
    - highest_sensitivity
    - highest_specificity
    - lowest_false_positives
    - nearest_baseline

# v0.30.1 formal-evaluation leakage guard. These patients were intentionally
# observed during technical/diagnostic validation and are removed BEFORE the
# Configuration/Final split. The 30/70 split therefore covers 100% of the
# remaining formal pool, not 100% of the originally prepared manifest.

# v0.30.2 operational execution only. This does not change the formal 30/70 split,
# candidate weights, thresholds, selection policy, preprocessing or model semantics.
# Orientation and inference are checkpointed using deterministic ordered chunks.
formal_inference:
  mode: chunked_resumable
  chunk_size: 25
  resume_enabled: true
  models_parallel: false
  model_order: [gmic, nyu, glam]
  cache_policy: SUCCESS_MARKER_AND_HASHES

formal_exclusions:
  rsna:
    manifest: datasets/manifests/rsna_diagnostic_exclusion_v1.csv
    required: true
    reason: PREVIOUSLY_OBSERVED_DIAGNOSTIC_SET
    exclude_from_configuration: true
    exclude_from_final: true
