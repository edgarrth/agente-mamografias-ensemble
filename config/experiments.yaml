split:
  configuration_ratio: 0.30
  final_test_ratio: 0.70
  by_patient: true
  stratified: true
  seed: 42

# Expanded predeclared search space for the formal RSNA Configuration Set.
# W01-W16 preserve the v0.30.2 identifiers exactly. W17-W40 add the missing
# 0.10-step simplex combinations while requiring every model to keep >= 0.10
# weight. This gives 40 unique weight combinations without adding zero-weight
# pseudo-ensembles (individual models are evaluated separately).
weights:
  W01: [0.333333, 0.333333, 0.333334]
  W02: [0.40, 0.30, 0.30]
  W03: [0.30, 0.40, 0.30]
  W04: [0.30, 0.30, 0.40]
  W05: [0.50, 0.25, 0.25]
  W06: [0.25, 0.50, 0.25]
  W07: [0.25, 0.25, 0.50]
  W08: [0.50, 0.30, 0.20]
  W09: [0.50, 0.20, 0.30]
  W10: [0.30, 0.50, 0.20]
  W11: [0.20, 0.50, 0.30]
  W12: [0.30, 0.20, 0.50]
  W13: [0.20, 0.30, 0.50]
  W14: [0.60, 0.20, 0.20]
  W15: [0.20, 0.60, 0.20]
  W16: [0.20, 0.20, 0.60]
  W17: [0.10, 0.10, 0.80]
  W18: [0.10, 0.20, 0.70]
  W19: [0.10, 0.30, 0.60]
  W20: [0.10, 0.40, 0.50]
  W21: [0.10, 0.50, 0.40]
  W22: [0.10, 0.60, 0.30]
  W23: [0.10, 0.70, 0.20]
  W24: [0.10, 0.80, 0.10]
  W25: [0.20, 0.10, 0.70]
  W26: [0.20, 0.40, 0.40]
  W27: [0.20, 0.70, 0.10]
  W28: [0.30, 0.10, 0.60]
  W29: [0.30, 0.60, 0.10]
  W30: [0.40, 0.10, 0.50]
  W31: [0.40, 0.20, 0.40]
  W32: [0.40, 0.40, 0.20]
  W33: [0.40, 0.50, 0.10]
  W34: [0.50, 0.10, 0.40]
  W35: [0.50, 0.40, 0.10]
  W36: [0.60, 0.10, 0.30]
  W37: [0.60, 0.30, 0.10]
  W38: [0.70, 0.10, 0.20]
  W39: [0.70, 0.20, 0.10]
  W40: [0.80, 0.10, 0.10]

# Expanded adaptive threshold grid. Thresholds remain label-independent and are
# derived separately for every weight combination from Configuration-Set score
# quantiles. More resolution is intentionally allocated to the upper tail because
# RSNA has low malignancy prevalence; this does NOT use labels to derive a threshold.
threshold_strategy:
  mode: score_quantiles
  derive_per_weight: true
  ground_truth_used_for_derivation: false
  quantiles:
    T01: 0.10
    T02: 0.20
    T03: 0.30
    T04: 0.40
    T05: 0.50
    T06: 0.60
    T07: 0.70
    T08: 0.80
    T09: 0.85
    T10: 0.90
    T11: 0.92
    T12: 0.94
    T13: 0.95
    T14: 0.96
    T15: 0.97
    T16: 0.98
    T17: 0.99

legacy_thresholds_v021_not_used:
  T01: 0.40
  T02: 0.45
  T03: 0.50
  T04: 0.55
  T05: 0.60

selection:
  protocol: stratified_5fold_cv_expanded_grid_v0310
  cv_folds: 5
  cv_seed: 42
  cv_shuffle: true
  full_configuration_refit_threshold: true
  balanced_accuracy_tolerance: 0.00
  order:
    - highest_roc_auc_by_weights
    - highest_balanced_accuracy
    - highest_sensitivity
    - highest_specificity
    - lowest_false_positives
    - nearest_baseline

formal_inference:
  mode: chunked_resumable
  chunk_size: 25
  resume_enabled: true
  models_parallel: false
  model_order: [gmic, nyu, glam]
  cache_policy: SUCCESS_MARKER_AND_HASHES
  cleanup_successful_chunk_temporaries: true
  xai_retention_per_model_per_chunk: 4

formal_exclusions:
  rsna:
    manifest: datasets/manifests/rsna_diagnostic_exclusion_v1.csv
    required: true
    reason: PREVIOUSLY_OBSERVED_DIAGNOSTIC_SET
    exclude_from_configuration: true
    exclude_from_final: true
