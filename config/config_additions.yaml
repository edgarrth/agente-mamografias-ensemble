additions:
- id: ADD-001
  name: MODEL_DEVICE
  value: cpu|gpu; default=cpu
  reason: The upstream model images use legacy CUDA/PyTorch stacks. CPU is the safe first-run mode until the target GPU passes
    a real smoke test.
  status: superseded
  superseded_by: ADD-036
- id: ADD-002
  name: ALLOW_LEGACY_GPU
  value: false by default
  reason: Prevents accidental use of an unverified legacy CUDA stack on a recent GPU.
  status: superseded
  superseded_by: ADD-037
- id: ADD-003
  name: MODEL_BOOTSTRAP_MODE
  value: lazy|eager; default=lazy
  reason: Building the three upstream model images can take time; a thesis prototype should start quickly and build the required
    model image on first use.
- id: ADD-004
  name: study_level_aggregation
  value: GMIC=max image; NYU=max breast; GLAM=max image
  reason: The three official outputs have different native granularities but soft voting requires one deterministic score
    per study.
- id: ADD-005
  name: explicit_dataset_download
  value: dataset selection is mandatory
  reason: Datasets are large and may require license/credential steps. Docker startup must never unexpectedly download hundreds
    of GB.
- id: ADD-006
  name: max_runtime_minutes
  value: optional; development only
  reason: Pilot tests need a predictable time budget. The final thesis test set must never be truncated by this option.
- id: ADD-007
  name: docker_socket_isolated_to_model_runner
  value: /var/run/docker.sock only in model-runner
  reason: Only the lightweight model-runner needs Docker daemon access to build and start the isolated upstream model images.
    FastAPI, Streamlit, bootstrap and model images do not receive the Docker socket.
- id: ADD-008
  name: no_automatic_prediction_fallback
  value: fail explicitly
  reason: The thesis forbids mocks and simulated probabilities.
- id: ADD-009
  name: source_manifest_boundary
  value: source_manifest.csv required for raw datasets
  reason: Native public datasets use different label schemas. Requiring an explicit mapping prevents the prototype from inventing
    or incorrectly deriving cancer ground truth.
- id: ADD-010
  name: xai_official_flag
  value: enable official visualization option for GMIC/GLAM when supported
  reason: The architecture requires real XAI. The model-runner only requests visualization already implemented by the upstream
    GMIC/GLAM image; it never synthesizes a heatmap.
- id: ADD-011
  name: minio_image_tag
  value: minio/minio:latest during prototype development
  reason: A verified immutable MinIO tag was not part of the research specification. Before definitive measurements, the resolved
    image digest must be recorded/pinned.
- id: ADD-012
  name: dicom_conversion_mode
  value: preserve native ordering; MONOCHROME1 inversion; BitsStored -> 16-bit left shift
  reason: The official metarepository expects 16-bit PNGs. A deterministic conversion is needed, but arbitrary learned/image-enhancement
    transformations are avoided. Dataset-specific VOI LUT needs must be validated separately before definitive measurements.
- id: ADD-013
  name: RESOURCE_SAMPLE_SECONDS
  value: 2 seconds by default
  reason: CPU/RAM/GPU resource metrics need periodic sampling while each real model container is executing. A small configurable
    interval keeps the prototype simple without a monitoring platform.
- id: ADD-014
  name: explicit_per_model_runtime_services
  value: gmic-runtime:8011 | nyu-runtime:8012 | glam-runtime:8013
  reason: This v0.2 decision exposed three controller services. It is superseded because model dependency isolation already
    occurs in the three upstream model images; three extra controllers were redundant for a thesis prototype.
  status: superseded
  superseded_by: ADD-017
- id: ADD-015
  name: single_runner_gpu_semaphore
  value: one GPU inference at a time by default, enforced by model-runner
  reason: The workstation has one GPU and 16 GB VRAM. The model-runner serializes GPU inference so GMIC, NYU and GLAM do not
    compete for GPU memory.
- id: ADD-016
  name: model_runtime_urls
  value: GMIC_RUNTIME_URL, NYU_RUNTIME_URL, GLAM_RUNTIME_URL
  reason: Per-model runtime URLs are no longer needed because FastAPI communicates with one model-runner endpoint and identifies
    the target model in the API path.
  status: superseded
  superseded_by: ADD-017
- id: ADD-017
  name: single_model_runner
  value: model-runner:8010
  reason: A single lightweight controller is sufficient to orchestrate all three isolated model images. This removes redundant
    controller containers while preserving separate model dependencies and checkpoints.
- id: ADD-018
  name: model_image_names
  value: mammography-model-gmic:research | mammography-model-nyu:research | mammography-model-glam:research
  reason: Explicit local image names make the distinction between the controller and the actual model environments clear in
    Docker image listings and thesis documentation.
- id: ADD-019
  name: model_runner_dependency_boundary
  value: no PyTorch, TensorFlow, CUDA Toolkit or cuDNN in model-runner
  reason: The runner schedules Docker jobs and controls GPU access but does not perform neural-network computation. ML/CUDA
    dependencies remain isolated inside each model image, avoiding incompatible framework stacks in the controller.
- id: ADD-020
  name: model_runner_api_contract
  value: /models, /models/{model}/info, /ensure, /smoke-test, /run
  reason: One uniform API keeps the application simple while retaining explicit model selection, health/status, provisioning
    and inference operations.
- id: ADD-021
  name: model_runner_official_docker_cli
  value: docker:29-cli (configurable with DOCKER_CLI_IMAGE)
  reason: The previous runner installed Debian docker.io, which can expose an Engine API version older than Docker Desktop
    accepts. The runner now uses Docker's official CLI image so it remains a thin Docker client while avoiding the stale CLI
    package boundary.
- id: ADD-022
  name: model_runner_docker_host
  value: unix:///var/run/docker.sock
  reason: The runner must talk to the host Docker Engine to build and execute the isolated model images. The socket remains
    mounted only in model-runner and the Docker host is explicit for WSL2/Docker Desktop diagnostics.
- id: ADD-023
  name: model_runner_doctor_endpoint
  value: GET /doctor
  reason: A thesis prototype should fail transparently. The endpoint distinguishes missing socket, socket permission/ping
    failure and Docker CLI/API failure without requiring FastAPI to be healthy first.
- id: ADD-024
  name: git_safe_directory_for_host_workspace
  value: /workspace/runtime/mammography_metarepository
  reason: Git can reject a repository on a WSL/Docker host bind mount when ownership differs inside the model-runner. The
    runner now adds only this exact metarepository path as a safe.directory before reading its commit and records the action
    in model_runner.jsonl.
- id: ADD-025
  name: legacy_cuda_base_image_compatibility
  value: nvidia/cudagl:10.1-devel-ubuntu18.04
  reason: The three upstream NYU metarepository Dockerfiles reference nvidia/cuda:10.1-base-ubuntu18.04, which is no longer
    resolvable in the target environment. The runner generates an auditable compatibility Dockerfile that changes only the
    FROM line; model source commits, model code, dependencies listed by upstream, and checkpoints remain unchanged.
- id: ADD-026
  name: compatibility_patch_drift_guard
  value: exact original FROM line required
  reason: The compatibility patch must fail if the upstream Dockerfile no longer starts with the expected historical base
    image. This prevents silently applying a thesis runtime patch to a changed upstream definition.
- id: ADD-027
  name: model_runner_error_detail_cli
  value: surface HTTP response detail in ensure and smoke-test commands
  reason: A research prototype must expose the real model build/inference failure instead of reducing it to a generic HTTP
    500 traceback. Detailed failures remain logged and are now also printed by the CLI.
- id: ADD-028
  name: legacy_nvidia_repository_key_rotation
  value: auto; preserve upstream fix when present, otherwise inject CUDA/ML signing-key refresh before apt-get update
  reason: The real GMIC compatibility build reached apt-get update and failed with NO_PUBKEY A4B469963BF863CC. NVIDIA rotated
    CUDA repository signing keys; the historical GMIC/GLAM Dockerfiles predate that change, while the NYU classifier Dockerfile
    already contains a key-refresh workaround. The runner now applies the narrow runtime-only repair reproducibly and logs
    whether it was injected or already present upstream.
- id: ADD-029
  name: fedora_wsl_nvidia_container_toolkit_preflight
  value: explicit host-side NVIDIA Container Toolkit + CDI diagnostic/setup before legacy GPU tests
  reason: 'The workstation exposes the RTX 5060 Ti to WSL through nvidia-smi, but Docker 29 reports "failed to discover GPU
    vendor from CDI: no known GPU vendor found". GPU access must therefore be repaired at the host WSL Docker layer before
    testing legacy PyTorch/CUDA model compatibility. The project adds host-only scripts; Docker Compose never installs host
    drivers or mutates NVIDIA host configuration automatically.'
- id: ADD-030
  name: blackwell_legacy_cuda_guard
  value: never run legacy PyTorch/CUDA model image on GPU after failed allocation probe
  reason: The RTX 5060 Ti is visible to Docker and PyTorch 1.1.0 reports CUDA available/device_count=1, but the first tensor
    .cuda() allocation hangs. Treat the legacy GPU path as incompatible and preserve it for CPU reproducibility only.
- id: ADD-031
  name: gmic_blackwell_runtime_profile
  value: mammography-model-gmic:blackwell-cu128; Python 3.10; PyTorch 2.7.1; torchvision 0.22.1; CUDA 12.8 wheel
  reason: PyTorch 2.7 introduced official Blackwell support with CUDA 12.8. The profile preserves the GMIC source commit and
    checkpoints, and applies only a narrow API compatibility replacement for the removed/deprecated torch.has_cudnn access;
    architecture, learned weights and inference semantics are not intentionally changed.
- id: ADD-032
  name: gpu_probe_fail_safe
  value: runner-managed GPU probe with hard timeout and unconditional docker rm -f cleanup
  reason: External shell timeout can leave detached model containers running. The runner now owns the probe lifecycle and
    always removes the test container, while logging the exact stage that succeeds or fails.
- id: ADD-033
  name: dual_runtime_model_images
  value: legacy :research for CPU; :blackwell-cu128 for validated GPU compatibility
  reason: Keep the original legacy environment available for reproducibility while using a separate auditable GPU runtime
    on modern Blackwell hardware. The runtime chosen is explicit in status, logs and registry.
- id: ADD-034
  name: gpu_probe_success_logging_duplicate_model_fix
  value: pass the GPU probe result record once to the structured logger
  reason: The real RTX 5060 Ti GPU probe reached its success path, wrote the GPU_READY result, and then the runner raised
    a Python TypeError because the logging call supplied `model` both explicitly and inside `**result`. This fix changes only
    observability/error handling; no model source, architecture, weights, runtime dependency, CUDA operation or inference
    behavior changes.
- id: ADD-035
  name: gpu_runtime_profile_model_metadata
  value: gpu_compatibility.profile is defined only in config/models.yaml for each model
  reason: A GPU runtime profile describes technical compatibility of a specific model (Python, framework and CUDA runtime).
    It is model metadata, not a deployment switch, so it must not be globally overridden from .env.
- id: ADD-036
  name: per_model_device_selection
  value: DEFAULT_MODEL_DEVICE plus GMIC_DEVICE, NYU_DEVICE and GLAM_DEVICE; each cpu|gpu
  reason: Device choice is a deployment concern and can legitimately differ by model while compatibility work is validated
    incrementally. This allows GMIC to run on its validated Blackwell profile while NYU and GLAM remain on CPU.
- id: ADD-037
  name: validated_gpu_image_only
  value: GPU inference always resolves the model-specific gpu_compatibility.image and requires a successful gpu_probe; ALLOW_LEGACY_GPU
    is removed
  reason: The dual-runtime design already prevents the legacy :research image from being selected for GPU. Keeping a second
    legacy-GPU flag was redundant and could confuse the thesis prototype configuration.
- id: ADD-038
  name: nyu_blackwell_runtime_profile
  value: mammography-model-nyu:blackwell-cu128; Python 3.10; PyTorch 2.7.1; torchvision 0.22.1; CUDA 12.8 wheel
  reason: The legacy DMV-CNN/NYU image uses PyTorch 0.4.1 with a CUDA 9.2 wheel. A separate Blackwell-compatible runtime is
    required for RTX 5060 Ti validation while preserving the pinned NYU source commit, pretrained checkpoints, architecture
    and inference contract.
- id: ADD-039
  name: model_owned_gpu_compatibility_patch_audit
  value: compatibility_code_patches list under each model gpu_compatibility block
  reason: GMIC and NYU require different narrow compatibility edits. Audit metadata must come from the selected model profile
    instead of a hard-coded GMIC patch description in the generic Model Runner.
- id: ADD-040
  name: glam_blackwell_runtime_profile
  value: mammography-model-glam:blackwell-cu128; Python 3.10; PyTorch 2.7.1; torchvision 0.22.1; CUDA 12.8 wheel
  reason: The legacy GLAM image uses PyTorch 1.1.0 and a CUDA 9.x-era binary plus a strict runtime-version assertion. A separate
    Blackwell-compatible runtime is required for RTX 5060 Ti validation while preserving the pinned GLAM source commit, pretrained
    checkpoints, architecture and inference contract.
- id: ADD-041
  name: glam_runtime_semantics_compatibility
  value: headless plotting, modern cuDNN capability API, device-local intermediate tensors, legacy integer index division,
    legacy grid_sample alignment
  reason: PyTorch/Matplotlib runtime semantics changed since the pinned GLAM implementation. These narrow compatibility edits
    are required to execute the same inference graph on a modern Blackwell runtime without changing model layers, learned
    parameters, checkpoint selection, output contract or training state.
- id: ADD-042
  name: cbis_ddsm_official_tcia_metadata_adapter
  value: recursively ingest the four official CBIS-DDSM classification CSVs plus the authorized TCIA/NBIA DICOM tree
  reason: The previous generic adapter required a researcher-authored source_manifest.csv. v0.13 removes that manual and error-prone
    mapping step for CBIS-DDSM by deriving patient, laterality, view and pathology only from the official release metadata
    and resolving those rows to downloaded DICOM files.
- id: ADD-043
  name: cbis_ddsm_pathology_only_ground_truth
  value: MALIGNANT=1; BENIGN=0; BENIGN_WITHOUT_CALLBACK=0; unknown pathology rejected; BI-RADS never converted to cancer labels
  reason: The thesis evaluates cancer classification. Ground truth must come from pathology supplied by the dataset, not from
    a heuristic conversion of radiologist assessment categories.
- id: ADD-044
  name: cbis_ddsm_recursive_raw_layout
  value: any NBIA-generated folder hierarchy is accepted under /workspace/datasets/raw/cbis_ddsm; official CSVs are discovered
    recursively
  reason: NBIA Data Retriever may preserve collection/case/UID directory levels. Requiring the researcher to flatten or rename
    roughly 160 GB of downloaded data would be fragile and unnecessary; the adapter resolves official paths by suffix/UID
    and caches a DICOM header index when needed.
- id: ADD-045
  name: cbis_ddsm_four_view_ensemble_gate
  value: require L-CC, R-CC, L-MLO and R-MLO for the current GMIC+NYU+GLAM ensemble; incomplete exams are catalogued and rejected,
    never duplicated or synthesized
  reason: The selected DMV-CNN/NYU exam-level classifier requires all four standard views. Fabricating a missing contralateral
    or projection view would change the scientific input and invalidate the evaluation, so v0.13 exposes compatibility counts
    before conversion.
- id: ADD-046
  name: cbis_ddsm_inspection_artifacts
  value: metadata row catalog, view catalog, unresolved-row report, incomplete-study report, generated source_manifest.csv
    and cached DICOM header index
  reason: Dataset adaptation is part of the thesis evidence. Persisting each mapping/rejection decision makes the transformation
    reproducible, auditable and diagnosable before expensive PNG conversion or model inference.
- id: ADD-047
  name: validated_three_gpu_env_example
  value: DEFAULT_MODEL_DEVICE=cpu; GMIC_DEVICE=gpu; NYU_DEVICE=gpu; GLAM_DEVICE=gpu; ALLOW_GPU=true; GPU_NUMBER=0
  reason: The three model-specific Blackwell runtimes have now passed GPU probes and end-to-end smoke tests on the target
    RTX 5060 Ti workstation. The distributed example environment should therefore reproduce the validated deployment state
    instead of the earlier CPU-safe bootstrap state.
- id: ADD-048
  name: cbis_ddsm_metadata_preflight_guard
  value: inspect/prepare return METADATA_REQUIRED with exact missing files and instructions; DICOM indexing is not started
    until all four official classification tables are present
  reason: NBIA image transfer can complete without the separate TCIA classification CSV supporting data. A research workflow
    should fail early and actionably rather than emit a Python traceback or spend time indexing DICOM files that cannot yet
    be labeled.
- id: ADD-049
  name: cbis_ddsm_metadata_filename_aliases
  value: canonical *_case_description_* filenames plus TCIA Mass/Calc-Training/Test-Description.csv aliases
  reason: TCIA data-access labels and downloaded filenames can differ while representing the same four official classification
    tables. Recognizing explicit aliases removes a packaging/layout dependency without changing metadata content or ground-truth
    semantics.
- id: ADD-050
  name: cbis_ddsm_non_destructive_dicom_download_policy
  value: dataset_pipeline.download never transfers DICOM bytes; existing raw DICOM tree is reused; missing DICOM returns DICOM_DOWNLOAD_REQUIRED
  reason: The CBIS-DDSM image collection is large and is already acquired through the official TCIA/NBIA mechanism. Re-running
    a prototype command must not duplicate ~163 GB, consume bandwidth or overwrite research inputs.
- id: ADD-051
  name: cbis_ddsm_manual_official_metadata_policy_v029
  value: never download mass/calc train/test case-description CSVs; validate manually placed files and expected SHA-256/columns
  reason: The researcher explicitly requires dataset acquisition to remain manual. This also prevents network-side changes from altering research inputs implicitly.
- id: ADD-052
  name: cbis_ddsm_auxiliary_series_metadata
  value: optional metadata.csv PatientID/StudyInstanceUID/SeriesInstanceUID enrichment joined by unique SeriesInstanceUID;
    never used as ground truth
  reason: The TCIA metadata export can encode participant, laterality and view in PatientID while DICOM headers or opaque
    NBIA paths may not. Using it only as an identity map can recover standard views without inventing labels or synthesizing
    images.
- id: ADD-053
  name: cbis_ddsm_reuse_completed_dicom_index
  value: reuse /workspace/runtime/dataset_cache/cbis_ddsm_dicom_index.csv by default; --force-dicom-index explicitly rebuilds
    after raw-tree changes
  reason: The first real inspection on the target WSL/NTFS workspace took about 11m33s. Reopening/rescanning the unchanged
    DICOM tree on every inspect is unnecessary; cache invalidation is therefore an explicit researcher action when the dataset
    changes.
- id: ADD-054
  name: cbis_ddsm_explicit_object_inventory
  value: inspect reports DICOM objects, full mammograms, crops, ROI masks, other DICOM, selected full views and complete-study
    ground-truth counts
  reason: Dataset evaluation must distinguish files/images, abnormality metadata rows, participants and four-view evaluation
    units. Explicit counts prevent methodological ambiguity in the thesis and in experiment manifests.
- id: ADD-055
  name: validated_env_example_retained_v015
  value: DEFAULT_MODEL_DEVICE=cpu; GMIC_DEVICE=gpu; NYU_DEVICE=gpu; GLAM_DEVICE=gpu; ALLOW_GPU=true; GPU_NUMBER=0
  reason: v0.15 changes only dataset acquisition/inspection. The distributed environment example must retain the model-device
    configuration that has already passed real GPU probes and smoke tests rather than introducing untested settings.
- id: ADD-056
  name: gmic_blackwell_legacy_integer_index_semantics
  value: src/utilities/tools.py get_max_window uses torch.div(max_linear_idx, W_map, rounding_mode=floor); GMIC gpu build_revision=2
  reason: The first real CBIS-DDSM integration exposed a negative ROI coordinate under modern true-division semantics. The
    pinned PyTorch-1.1-era code expected integer quotient/remainder indices. Preserving that historical arithmetic fixes runtime
    compatibility without changing model architecture, checkpoints, weights, saliency objective or training state.
- id: ADD-057
  name: healthcheck_access_log_state_transitions
  value: log first /health state, first failure and first recovery; suppress repeated access logs with unchanged health state
  reason: Docker probes every 15 seconds and repeated 200 access lines obscure research/model logs. State-transition logging
    preserves operational signal without changing the healthcheck itself.
- id: ADD-058
  name: container_version_exposure
  value: VERSION copied to /app/VERSION and /runner/VERSION; API health/doctor report current package version (0.23.0)
  reason: Runtime version must be directly verifiable inside the running containers and must not retain stale hardcoded endpoint
    versions.
- id: ADD-059
  name: parameterized_gpu_release_validation
  value: model_tools.validate_gpu accepts one or more models or all; phases are ensure_gpu for all selected, gpu_probe for
    successful ensures, then smoke_test for successful probes; report persisted under workspace/output/model_validation
  reason: Repeating three separate commands per model is error-prone after compatibility revisions. A deterministic orchestration
    command provides one auditable validation flow while preserving model-specific images, profiles and evidence.
- id: ADD-060
  name: explicit_gpu_force_rebuild
  value: ensure-gpu accepts force_rebuild; validate_gpu exposes --force-rebuild; default remains idempotent and rebuilds only
    when image is missing or build_revision changes
  reason: Normal validation should reuse already validated image bytes, but research/release troubleshooting sometimes requires
    a deliberate fresh build. Making this explicit prevents unnecessary rebuilds while preserving a reproducible escape hatch.
- id: ADD-061
  name: gpu_validation_device_guard
  value: integrated GPU smoke validation requires each selected model to resolve device=gpu unless --allow-cpu-smoke is explicitly
    supplied
  reason: A successful smoke test routed to a legacy CPU image must never be mistaken for validation of the newly ensured
    Blackwell GPU image.
- id: ADD-062
  name: gmic_metarepository_malignant_only_label_contract
  value: GMIC Blackwell accepts left_malignant/right_malignant canonical labels; absent benign labels are emitted as NaN output
    metadata
  reason: The metarepository canonical batch does not require independent benign labels. GMIC standalone read those labels
    only after inference to populate its output CSV. Missing optional benign labels must not abort inference and must not
    be fabricated.
- id: ADD-063
  name: model_run_operation_status_precedence
  value: /models/{model}/run merges image/runtime metadata first and writes status=SUCCESS last after a prediction CSV is
    verified
  reason: ensure_image/ensure_gpu_image metadata carries status=READY for runtime availability. That readiness state must
    not overwrite the completed inference operation status used by the pipeline guard.
- id: ADD-064
  name: glam_metarepository_malignant_only_label_contract
  value: GLAM Blackwell accepts left_malignant/right_malignant canonical labels; absent benign labels are emitted as NaN output
    metadata; GLAM build_revision=2
  reason: The first real CBIS-DDSM run reaching GLAM completed crop/center/classifier setup but aborted while copying optional
    left_benign/right_benign labels. These labels are not required by the canonical malignant-only batch contract and must
    not be fabricated.
- id: ADD-065
  name: per_model_preprocessed_isolation
  value: normal/experimental/final inference uses model_batch/preprocessed/<model> instead of a shared preprocessed directory
  reason: A shared directory caused NYU to report GMIC visualization files as its own XAI in a real run. Model-specific directories
    preserve provenance and prevent artifact cross-contamination.
- id: ADD-066
  name: explicit_image_prediction_study_identity
  value: study_order.csv stores original study_id plus sanitized study_key; GMIC/GLAM predictions merge through that key with
    one-to-one validation and collision detection
  reason: Assigning image-level scores by row order after groupby can silently associate scores with the wrong study if lexical/group
    order differs from manifest order. Explicit identity mapping is required for scientific traceability.
- id: ADD-067
  name: model_runner_console_lifecycle_logging
  value: high-value model lifecycle events are emitted to container stdout and persisted to model_runner.jsonl; repetitive
    health probes remain transition-filtered
  reason: Researchers need visible progress and failure context in docker compose logs during long model calls without reintroducing
    healthcheck noise.
- id: ADD-068
  name: chunk_evidence_aggregation
  value: normal-test chunk mode aggregates per-chunk XAI manifests and resource metrics into run-root xai_artifacts.json/resource_metrics.csv
  reason: max-runtime mode previously left evidence only inside chunk directories, making run-level reporting incomplete even
    after a successful multi-chunk execution.
- id: ADD-069
  name: fastapi_lifespan_startup_hooks
  value: FastAPI and Model Runner startup initialization uses lifespan context instead of deprecated app.on_event(startup)
  reason: The extended pre-release validation surfaced FastAPI deprecation warnings. Migrating the startup hook now removes
    warning noise and avoids relying on an API scheduled for removal without changing startup behavior.
- id: ADD-070
  name: normal_test_reproducible_sampling
  value: tests_flow.normal supports sequential, random, stratified proportional and balanced class-aware sampling with deterministic
    --seed
  reason: The first successful 5-study CBIS-DDSM integration selected five benign studies because legacy first-N sampling
    was class-unaware. Reproducible class-aware sampling is required to exercise both ground-truth classes without changing
    the prepared dataset.
- id: ADD-071
  name: normal_test_sampling_traceability
  value: every normal test writes selected_studies.csv and persists strategy, seed, available/requested/actual class distributions
    in configuration_used.yaml and run_summary.json
  reason: A thesis result must be reproducible from the exact study identities and sampling policy rather than only a sample
    count.
- id: ADD-072
  name: resource_monitoring_sample_naming
  value: resource metric field samples is renamed to monitoring_samples
  reason: The previous field counted periodic resource-monitor observations, not dataset studies or mammography images. The
    ambiguous name could be misinterpreted in experimental reporting.
- id: ADD-073
  name: unavailable_metric_reasons
  value: metrics.json explicitly records sensitivity_unavailable_reason and roc_auc_unavailable_reason when a selected sample
    lacks the required ground-truth classes
  reason: Null metrics are mathematically correct for single-class samples but must be explained explicitly in research evidence
    instead of appearing as unexplained missing values.
- id: ADD-074
  name: normal_test_run_summary
  value: normal tests persist run_summary.json with processed_studies, processed_images, sampling metadata and overall_elapsed_seconds
  reason: End-to-end evaluation needs an unambiguous distinction between study/image counts, resource-monitor observations
    and wall-clock runtime.
- id: ADD-075
  name: configuration_score_analysis
  value: cached raw model scores can be analyzed without GPU inference; outputs include per-model ROC-AUC, class distributions,
    correlations, ROC points, candidate thresholds and explicit research guards
  reason: The first balanced 10-study real run showed that the fixed 0.50 baseline threshold was far above observed ensemble
    scores and that ranking quality must be inspected independently of classification threshold before the full experiment.
- id: ADD-076
  name: adaptive_configuration_threshold_grid
  value: the 5 threshold candidates for each of 16 weight combinations are Configuration-Set score quantiles T01=0.10, T02=0.30,
    T03=0.50, T04=0.70, T05=0.90; candidate derivation is label-independent
  reason: The legacy fixed 0.40-0.60 grid would classify every observed v0.21 score as negative. Deriving candidates from
    Configuration-Set score scale preserves 16x5=80 CPU combinations while avoiding a demonstrably irrelevant absolute range
    and without using final-test labels or scores.
- id: ADD-077
  name: final_test_inference_isolation_and_cache
  value: experimental configuration inference occurs only on the Configuration Set; Final Test Set inference is forbidden
    before freeze and an existing final raw_model_predictions.csv is reused on repeated final_evaluation calls
  reason: The thesis methodology requires final-test isolation until configuration is frozen and models should not be rerun
    unnecessarily. Each study is therefore inferred at most once within a given experiment workflow.
- id: ADD-078
  name: experiment_score_evidence
  value: experimental configuration and final phases persist score-analysis evidence in configuration_score_analysis/ and
    final_score_analysis/ respectively
  reason: Weight/threshold decisions and final interpretation must be traceable to raw malignancy scores, model-specific discrimination
    and score correlations rather than only the consolidated confusion matrix.
- id: ADD-079
  name: breast_aware_aggregation_diagnostic
  value: CPU-only comparison of current max-per-model-then-vote versus vote-per-breast-then-max across all 16 weight combinations
  reason: NYU showed substantially stronger discrimination at breast level than study level in the 10-study diagnostic. The
    alternative aggregation order must be tested from cached scores before changing the production contract; diagnostic results
    remain ineligible for freeze.
- id: ADD-080
  name: input_fidelity_audit
  value: audit selected 16-bit PNG headers, source DICOM presentation metadata when available, and upstream crop/center metadata
    including distance_from_starting_side and best_center
  reason: GMIC and GLAM remain weak already at breast level while NYU retains useful breast-level signal. Before more weight/threshold
    optimization, verify DICOM-to-PNG fidelity and model-native preprocessing/orientation evidence without rerunning GPU inference
    or mutating the dataset.
- id: ADD-081
  name: orientation_counterfactual_diagnostic
  value: toggle horizontal_flip only for studies where all four unique views have distance_from_starting_side != 0, rerun
    the three models only for those studies, and compare upstream geometric preprocessing evidence plus secondary score impact
  reason: v0.25 validated 40/40 PNG and DICOM input fidelity but localized the orientation gap signal to two complete studies.
    Upstream NYU/GMIC documents this metadata as useful for detecting a wrong horizontal_flip depending on dataset. Geometry,
    not post-hoc AUC, is the primary decision criterion.
  version: 0.26.0

- id: ADD-082
  name: automatic_orientation_resolution
  value: before classifier inference, run label-independent NYU upstream crop+center preprocessing; trigger only when all four unique views have distance_from_starting_side != 0 and accept horizontal_flip toggle only when all four counterfactual distances become zero
  reason: v0.26 counterfactual evidence showed that the two four-view-gap studies changed from mean distances 839.5/813.5 pixels to 0 for all views and all three models when horizontal_flip was toggled. The rule therefore operationalizes upstream geometric evidence without using ground truth, model scores, AUC, ensemble weights or thresholds.
  version: 0.27.0

- id: ADD-083
  name: nyu_preprocess_only_pythonpath_fix
  value: PREPROCESS_ONLY exports /home/bcc/breast_cancer_classifier into PYTHONPATH before invoking upstream crop_mammogram.py and get_optimal_centers.py directly
  reason: v0.27.0 orientation preflight exposed the upstream repository requirement that individual Python scripts include the repository root in PYTHONPATH; without it crop_mammogram.py fails at import src.utilities.pickling before preprocessing starts
  version: 0.27.1

- id: ADD-084
  name: upstream_reference_runtime_validation
  value: run GMIC, NYU and GLAM Blackwell compatibility images on the official 4-exam mammography metarepository sample and compare image/breast AUROC and AUPRC with the three-decimal reproduction references published upstream
  reason: After correcting CBIS-DDSM orientation, discrimination remains weak and mixed across models. Before attributing this to dataset/domain shift, validate that the modern Blackwell runtime preserves the upstream sample score ordering without changing model weights, ensemble weights, thresholds or CBIS-DDSM data.
  version: 0.28.0

- id: ADD-085
  name: input_scale_and_small_sample_uncertainty_diagnostics
  value: before upstream GPU reproduction, compare CBIS-DDSM versus official-sample 16-bit PNG intensity distributions and optional NYU upstream-cropped pixels without classifier inference; score analysis also reports 2,000-replicate stratified-bootstrap ROC-AUC confidence intervals and the pairwise AUC step for small diagnostic sets
  reason: The corrected 10-study run still produces low malignancy-score ranges across all three NYU-family models. A shared input-scale mismatch is therefore worth checking cheaply before GPU reference inference, while n=10 point-estimate AUC deltas must be accompanied by explicit uncertainty rather than interpreted as conclusive changes.
  version: 0.28.1

- id: ADD-086
  name: glam_legacy_cpu_vs_blackwell_runtime_differential
  value: compare GLAM predictions on the official 4-exam sample between the pinned upstream PyTorch 1.1 CPU image and the PyTorch 2.7/CUDA 12.8 Blackwell compatibility image; compare per-image scores, pairwise ordering and official AUROC/AUPRC reproduction
  reason: v0.28.1 upstream validation reproduces GMIC and NYU to the published three-decimal references, but GLAM changes image/breast ordering (observed 0.800/0.800 vs expected 0.700/0.733). A direct legacy-runtime differential isolates whether the mismatch was introduced by Blackwell compatibility changes or is already present in the current upstream artifact.
  version: 0.28.2

- id: ADD-087
  name: cmmd_official_tcia_adapter_v029
  value: manual DICOM + CMMD_clinicaldata_revision.xlsx; ViewCodeSequence 399162004=CC and 399368009=MLO; ImageLaterality=L/R
  reason: The audited TCIA CMMD DICOM release has empty ViewPosition but complete ViewCodeSequence semantics.
- id: ADD-088
  name: cmmd_binary_benchmark_policy_v029
  value: expose CMMD1/D1 exact four-view studies with explicit bilateral clinical labels; study malignant if either breast is malignant; retain D2 as nonbenchmark audit cohort
  reason: The observed four-view pool is dominated by malignant-only D2, so mixing D1 and D2 would confound binary class with cohort.
- id: ADD-089
  name: dataset_network_download_disabled_v029
  value: CBIS-DDSM, CMMD and RSNA adapters perform no network dataset downloads; missing files return actionable manual acquisition status
  reason: Preserve explicit researcher-controlled acquisition and immutable raw inputs.
- id: ADD-090
  name: rsna_official_train_adapter_v030
  value: manually acquired train.csv + train_images; no automatic network download; raw inputs immutable
  reason: RSNA is the large labelled cohort selected for the next formal ensemble experiment and requires a dataset-aware adapter with explicit provenance.
- id: ADD-091
  name: rsna_required_four_views_v1
  value: require at least one L_CC, R_CC, L_MLO and R_MLO per patient; do not require exactly four DICOM objects
  reason: All 11,913 audited RSNA train patients contain the four required standard views, while 3,680 also contain repeated or additional images; exact-four filtering would discard valid patients and malignant cases unnecessarily.
- id: ADD-092
  name: rsna_duplicate_view_selection_v1
  value: select one image per repeated canonical view by deterministic label-blind SHA-256 over policy_id, patient_id, canonical_view and image_id
  reason: Repeated CC/MLO views must be resolved reproducibly without using cancer labels, BI-RADS, pixels, model scores, AUC or filesystem ordering.
- id: ADD-093
  name: rsna_compressed_dicom_codecs_v030
  value: pylibjpeg 2.1.0 + pylibjpeg-libjpeg 2.4.0 + pylibjpeg-openjpeg 2.5.0
  reason: The audited RSNA train DICOMs use JPEG Lossless SV1 and JPEG 2000 Lossless; these plugin versions decoded a targeted 20-image compatibility sample with 20/20 success on the application runtime.
- id: ADD-094
  name: rsna_study_ground_truth_v1
  value: cancer is read only from train.csv; breast labels must be internally consistent; study is malignant if either breast is malignant, otherwise benign when both breasts are benign
  reason: Preserve the official cancer label as the only binary ground-truth source and reject contradictory breast labels rather than inventing a resolution.
